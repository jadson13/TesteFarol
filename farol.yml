name: Gerar Farol (a partir de dados/)

# Dispara quando novas bases chegam na pasta dados/ (botao "Importar bases" do dashboard).
# Roda o motor REAL (motor/gerar_dados.py), regenera o index.html e faz commit de volta.
on:
  push:
    paths:
      - 'dados/**'
  workflow_dispatch:        # permite rodar manualmente pela aba Actions

permissions:
  contents: write

concurrency:
  group: gerar-farol
  cancel-in-progress: false

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Dependencias
        run: pip install openpyxl==3.1.5

      - name: Gerar index.html
        run: python3 motor/gerar_dados.py --repo .

      - name: Commit do index.html
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --staged --quiet; then
            echo "Nada mudou no index.html."
          else
            git commit -m "Atualiza farol (automatico a partir de dados/)"
            git push
          fi
